name: CI

on:
  workflow_call:
  push:
    branches: ["main", "feat/interoperability-layer"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check interoperability syntax
        run: node --check interoperability.js
      - name: Run interoperability tests
        run: node tests/interoperability.test.js
      - name: Run Story Engine smoke tests
        run: node tests/story-engine-smoke.js
      - name: Run Story storage recovery tests
        run: node tests/story-storage.test.js

      - name: Run Radar source card regression tests
        run: node --test tests/source-cards.test.js

      - name: Run Story Router and ledger contract tests
        run: node --test tests/story-router.test.js


      - name: Check creator session and optional viewer syntax
        run: |
          node --check session-model.js
          node --check session.js
          node --check streamplace.js
          node --check app.js
      - name: Test session consent and optional viewer lifecycle
        run: node --test tests/session.test.js tests/streamplace.test.js

      - name: Check focused artist workspace syntax
        run: |
          node --check creator-model.js
          node --check creator.js
      - name: Test artist review, handoff and recovery contracts
        run: node --test tests/creator.test.js

      - name: Test local Morgue Ink outcomes and operator boundaries
        run: node --test tests/morgue.test.js

      - name: Test tools navigation and audio regressions
        run: |
          node --check tools-control.js
          node --check spotify-controller.js
          node --check storage-router.js
          node --test tests/tools.test.js
