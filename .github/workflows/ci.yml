name: CI

on:
  push:
    branches: ["main", "feat/interoperability-layer"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check interoperability syntax
        run: node --check interoperability.js
      - name: Run interoperability tests
        run: node tests/interoperability.test.js
      - name: Run Story Engine smoke tests
        run: node tests/story-engine-smoke.js
      - name: Run Story storage recovery tests
        run: node tests/story-storage.test.js

      - name: Run Story Router and ledger contract tests
        run: node --test tests/story-router.test.js
