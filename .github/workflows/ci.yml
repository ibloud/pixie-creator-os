name: CI

on:
  push:
    branches: ["main", "feat/interoperability-layer"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run interoperability tests
        run: node tests/interoperability.test.js
